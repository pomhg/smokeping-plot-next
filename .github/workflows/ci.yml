name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build web
        run: cd web && npm ci && npm run build
      - name: Go vet & test
        run: |
          gofmt -l . | tee /dev/stderr | wc -l | grep -q '^0$'
          go vet ./...
          go test ./...
      - name: Build binary
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/smokeping-plot-next ./cmd/smokeping-plot-next
